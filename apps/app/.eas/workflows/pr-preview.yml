# Deploys a preview address for every pull request and posts the link on the PR,
# so the reviewer can click through the change before merging.
# Schema: https://docs.expo.dev/eas/hosting/workflows.md
name: PR preview

# Only pull requests that touch the web app get a preview.
on:
  pull_request:
    paths:
      - apps/app/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - '!**/*.md'

jobs:
  deploy:
    name: Deploy PR preview
    type: deploy
    environment: preview

  comment:
    needs: [deploy]
    type: github-comment
